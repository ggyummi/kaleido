name: Delete all _flat backdrop files

on:
  workflow_dispatch:

jobs:
  delete-flat-files:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Delete all _flat.jpg and _flat.webp files
        run: |
          find collections/ -type f \( -name "*_flat.jpg" -o -name "*_flat.webp" \) -delete
          echo "Deleted files:"
          git diff --name-only

      - name: Commit and push deletions
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "chore: remove all _flat backdrop files"
          git push
