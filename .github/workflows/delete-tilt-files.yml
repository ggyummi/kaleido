name: Delete all _tilt backdrop files

on:
  workflow_dispatch:

jobs:
  delete-tilt-files:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Delete only plain _tilt files (not t1_tilt)
        run: |
          find collections/ -type f \( -name "*_tilt.jpg" -o -name "*_tilt.webp" \) \
            ! -name "*_t1_tilt.jpg" ! -name "*_t1_tilt.webp" \
            ! -name "*_t2_tilt.jpg" ! -name "*_t2_tilt.webp" -delete
          echo "Deleted files:"
          git diff --name-only

      - name: Commit and push deletions
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "chore: remove all _tilt backdrop files"
          git push
