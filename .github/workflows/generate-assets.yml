# ─────────────────────────────────────────────────────────────────────────────
# .github/workflows/generate-assets.yml
#
# tiny-deluxe · Nuvio TV — Catalog Asset Generator
#
# What this workflow produces (per matched catalog)
# ─────────────────────────────────────────────────────────────────────────────
#   collections/{folder}/{catalog}/backdrops/backdrop.jpg(.webp)
#       Landscape collage grid of top-ranked items in the catalog.
#
#   collections/{folder}/{catalog}/focused/focused.jpg(.webp)
#       Hero banner: full backdrop + left gradient + uppercase label + glow.
#       Used as the "selected / hover" state in Nuvio TV.
#
#   collections/{folder}/{catalog}/cover/cover.jpg(.webp)
#       Same layout as focused but without the glow — the unfocused state.
#       The visual difference creates the pop effect when a user scrolls on.
#
#   collections/{folder}/{catalog}/title/
#       Initialized only. Never touched by automation (manual assets safe).
#
# Required GitHub Secrets  (Settings → Secrets and variables → Actions)
# ─────────────────────────────────────────────────────────────────────────────
#   TMDB_API_KEY    https://www.themoviedb.org/settings/api
#
# Triggering manually
# ─────────────────────────────────────────────────────────────────────────────
#   1. Go to Actions → "🎨 Nuvio · Catalog Asset Generator"
#   2. Click "Run workflow"
#   3. Set Target and Force Regenerate, then click the green button.
# ─────────────────────────────────────────────────────────────────────────────

name: "🎨 Nuvio · Catalog Asset Generator"

on:
  workflow_dispatch:
    inputs:

      target:
        description: >
          Which catalog(s) to process. Use a {folder} name (e.g. discover)
          to run every catalog inside that folder, a specific {catalog} slug
          (e.g. recommended) to run just that one, or "all" to process every
          enabled entry in nuvio-collections.json.
        required: true
        default: "all"
        type: string

      force_regenerate:
        description: >
          Force regeneration even when output files already exist on disk.
          Leave unchecked for faster incremental runs.
        required: false
        default: false
        type: boolean

# Grant write access so the bot can push generated images back to the repo.
permissions:
  contents: write

jobs:
  generate-assets:
    name: "Generate & Commit Catalog Assets"
    runs-on: ubuntu-latest

    steps:

      # ── 1. Checkout ────────────────────────────────────────────────────────────────────
      - name: "📥 Checkout repository"
        uses: actions/checkout@v4
        with:
          fetch-depth: 0           # full history required for reliable push

      # ── 2. Python ─────────────────────────────────────────────────────────────────────
      - name: "🐍 Set up Python 3.11"
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      # ── 3. Helvetica Neue Bold equivalent ────────────────────────────────────────────
      # fonts-urw-base35 ships NimbusSans-Bold.otf, the open-source
      # metric-compatible equivalent of Helvetica Neue Bold.
      # fonts-liberation provides a TTF fallback (LiberationSans-Bold).
      - name: "🖋 Install Helvetica-equivalent font (NimbusSans Bold)"
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            fonts-urw-base35 \
            fonts-liberation
          fc-cache -fv
          echo "── Installed fonts ──"
          fc-list | grep -i "nimbus\|liberation" | grep -i bold | head -10 || true

      # ── 4. Python dependencies ─────────────────────────────────────────────────────────
      - name: "📦 Install Python dependencies"
        run: |
          python -m pip install --upgrade pip
          pip install requests Pillow
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          fi

      # ── 5. Validate nuvio-collections.json is present ────────────────────────────
      - name: "🔍 Validate nuvio-collections.json"
        run: |
          if [ ! -f nuvio-collections.json ]; then
            echo "❌  nuvio-collections.json not found in the repository root."
            echo "    Create it with catalog entries using the pattern:"
            echo '    { "id": "collections.{folder}.{catalog}", ... }'
            exit 1
          fi
          python3 -c "
          import json, sys
          with open('nuvio-collections.json') as f:
              data = json.load(f)
          items = data if isinstance(data, list) else data.get('catalogs', [])
          matches = [
              c['id'] for c in items
              if c.get('id','').startswith('collections.')
              and c['id'].count('.') == 2
          ]
          print(f'Found {len(matches)} collections.* catalog(s):')
          for m in matches:
              print(f'  {m}')
          if not matches:
              print('Warning: No collections.{folder}.{catalog} IDs found.')
              sys.exit(1)
          "

      # ── 6. Run asset generator ─────────────────────────────────────────────────────────
      - name: "🚀 Generate catalog assets"
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
        run: |
          FORCE_FLAG=""
          if [ "${{ github.event.inputs.force_regenerate }}" = "true" ]; then
            FORCE_FLAG="--force"
          fi

          python generate_catalog_assets.py \
            --target "${{ github.event.inputs.target }}" \
            --json   nuvio-collections.json \
            $FORCE_FLAG

      # ── 7. Commit & push all new assets ───────────────────────────────────────────────
      - name: "📤 Commit & push generated assets"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Stage generated assets only — never touch title/ contents
          git add \
            "collections/*/*/backdrops/*.jpg" \
            "collections/*/*/backdrops/*.webp" \
            "collections/*/*/focused/*.jpg" \
            "collections/*/*/focused/*.webp" \
            "collections/*/*/cover/*.jpg" \
            "collections/*/*/cover/*.webp" \
            2>/dev/null || true

          # Also stage any newly created (empty) title/ dirs via .gitkeep
          find collections -type d -name "title" | while read dir; do
            if [ -z "$(ls -A "$dir" 2>/dev/null)" ]; then
              touch "$dir/.gitkeep"
            fi
          done
          git add "collections/*/*/*/.gitkeep" 2>/dev/null || true

          if git diff --cached --quiet; then
            echo "✅  No new assets generated — nothing to commit."
          else
            CHANGED=$(git diff --cached --name-only | wc -l)
            N_BACK=$(git diff --cached --name-only | grep -c 'backdrops/' || true)
            N_FOC=$(git diff --cached  --name-only | grep -c 'focused/'   || true)
            N_COV=$(git diff --cached  --name-only | grep -c 'cover/'     || true)
            TARGET="${{ github.event.inputs.target }}"

            git commit -m "🎨 Catalog assets: target=${TARGET} — ${N_BACK} backdrop(s), ${N_FOC} focused, ${N_COV} cover(s) [Automated]"

            git push \
              "https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}.git" \
              HEAD:${{ github.ref_name }}

            echo ""
            echo "✅  Pushed ${CHANGED} file(s) to ${{ github.ref_name }}."
            echo "    ↓ ${N_BACK}  backdrop(s)"
            echo "    ↓ ${N_FOC}  focused banner(s)"
            echo "    ↓ ${N_COV}  cover banner(s)"
          fi

      # ── 8. Purge jsDelivr CDN cache for updated files ──────────────────────────────
      # Runs even when no new files were committed (safe — jsDelivr ignores
      # purge requests for unchanged files).
      - name: "🧹 Purge jsDelivr CDN cache"
        env:
          REPO_SLUG: ${{ github.repository }}
        run: |
          python collections/scripts/purge.py || true
