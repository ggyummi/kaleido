# ─────────────────────────────────────────────────────────────────────────────
# .github/workflows/generate-covers.yml
#
# tiny-deluxe · Nuvio TV — Cover Generator
#
# Generates Apple TV+-style cover cards for each matched catalog.
# Four files are written per catalog:
#
#   collections/{folder}/focused/{catalog}_landscape.jpg(.webp)   1920×1080 — dimmed + cinematic gradient + title
#   collections/{folder}/focused/{catalog}_portrait.jpg(.webp)     680×1000  — dimmed + cinematic gradient + title
#   collections/{folder}/cover/{catalog}_landscape.jpg(.webp)     1920×1080 — full brightness + gradient + title
#   collections/{folder}/cover/{catalog}_portrait.jpg(.webp)       680×1000  — full brightness + gradient + title
#
# A smooth bottom gradient fades from transparent at ~55% image height to near-black
# at the bottom edge. The catalog title (emoji stripped, original casing) is rendered
# bold, lower-left aligned, with word-wrap for multi-word labels.
# "focused" cards dim the backdrop to 50% brightness before the gradient is applied.
#
# Secrets  (Settings → Secrets and variables → Actions)
# ─────────────────────────────────────────────────────────────────────────────
#   AIOMETADATA_URL   Base URL of your AIOMetadata Stremio addon (recommended)
#   TMDB_API_KEY      TMDb API key (optional fallback)
# ─────────────────────────────────────────────────────────────────────────────

name: "🎨 Nuvio · Cover Generator"

on:
  workflow_dispatch:
    inputs:

      target:
        description: >
          Folder (e.g. streaming), catalog slug (e.g. netflix), or "all".
        required: true
        default: "all"
        type: string

      force_regenerate:
        description: >
          Force regeneration even when cover files already exist on disk.
        required: false
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  generate-covers:
    name: "Generate & Commit Cover Assets"
    runs-on: ubuntu-latest

    steps:

      # ── 1. Checkout ──────────────────────────────────────────────────────────
      - name: "📥 Checkout repository"
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ── 2. Python ────────────────────────────────────────────────────────────
      - name: "🐍 Set up Python 3.11"
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      # ── 3. Font — required for label rendering ───────────────────────────────
      # Priority: Open Sans Bold → NimbusSans Regular → LiberationSans Regular
      - name: "🖋 Install fonts (Open Sans Bold, NimbusSans, LiberationSans)"
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            fonts-open-sans \
            fonts-urw-base35 \
            fonts-liberation
          fc-cache -fv
          fc-list | grep -i "open.sans\|nimbus\|liberation" | head -10 || true

      # ── 4. Python dependencies ───────────────────────────────────────────────
      - name: "📦 Install Python dependencies"
        run: |
          python -m pip install --upgrade pip
          pip install requests Pillow
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      # ── 5. Validate nuvio-collections.json ───────────────────────────────────
      - name: "🔍 Validate nuvio-collections.json"
        run: |
          if [ ! -f nuvio-collections.json ]; then
            echo "❌  nuvio-collections.json not found in the repository root."
            exit 1
          fi
          python3 -c "
          import json, sys
          with open('nuvio-collections.json') as f:
              data = json.load(f)
          items = data if isinstance(data, list) else data.get('catalogs', [])
          flat = []
          for item in items:
              flat.extend(item['folders']) if 'folders' in item else flat.append(item)
          matches = [c['id'] for c in flat
                     if c.get('id','').startswith('collections.')
                     and c['id'].count('.') == 2]
          print(f'Found {len(matches)} collections.* catalog(s):')
          for m in matches[:10]:
              print(f'  {m}')
          if len(matches) > 10:
              print(f'  ... and {len(matches) - 10} more')
          if not matches:
              print('Warning: No collections.{folder}.{catalog} IDs found.')
              sys.exit(1)
          "

      # ── 6. Generate cover assets ─────────────────────────────────────────────
      - name: "🚀 Generate cover assets"
        env:
          AIOMETADATA_URL: ${{ secrets.AIOMETADATA_URL }}
          TMDB_API_KEY:    ${{ secrets.TMDB_API_KEY }}
        run: |
          FORCE_FLAG=""
          if [ "${{ github.event.inputs.force_regenerate }}" = "true" ]; then
            FORCE_FLAG="--force"
          fi
          python generate_catalog_assets.py \
            --target "${{ github.event.inputs.target }}" \
            --mode   covers \
            --json   nuvio-collections.json \
            $FORCE_FLAG

      # ── 7. Commit & push cover assets ────────────────────────────────────────
      - name: "📤 Commit & push cover assets"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add \
            "collections/*/focused/*.jpg" \
            "collections/*/focused/*.webp" \
            "collections/*/cover/*.jpg" \
            "collections/*/cover/*.webp" \
            2>/dev/null || true

          # Stage .gitkeep for newly created title/ dirs
          find collections -type d -name "title" | while read dir; do
            if [ -z "$(ls -A "$dir" 2>/dev/null)" ]; then
              touch "$dir/.gitkeep"
            fi
          done
          git add "collections/*/*/.gitkeep" 2>/dev/null || true

          if git diff --cached --quiet; then
            echo "✅  No new covers — nothing to commit."
          else
            N_FOC=$(git diff --cached --name-only | grep -c '/focused/' || true)
            N_COV=$(git diff --cached --name-only | grep -c '/cover/'   || true)
            TARGET="${{ github.event.inputs.target }}"
            git commit -m "🎨 Cover assets: target=${TARGET} — ${N_FOC} focused, ${N_COV} cover(s) [Automated]"
            REMOTE="https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}.git"
            for attempt in 1 2 3 4 5; do
              git pull --rebase "$REMOTE" ${{ github.ref_name }} 2>/dev/null \
                || { git rebase --abort 2>/dev/null || true; }
              if git push "$REMOTE" HEAD:${{ github.ref_name }}; then
                echo ""
                echo "✅  Pushed to ${{ github.ref_name }} (attempt ${attempt})."
                echo "    ↓ ${N_FOC}  focused banner(s)"
                echo "    ↓ ${N_COV}  cover banner(s)"
                break
              fi
              if [ "${attempt}" -eq 5 ]; then
                echo "❌  Push failed after 5 attempts."
                exit 1
              fi
              echo "⚠  Attempt ${attempt} failed — retrying in $((attempt * 2))s..."
              sleep $((attempt * 2))
            done
          fi

      # ── 8. Purge jsDelivr CDN cache ──────────────────────────────────────────
      - name: "🧹 Purge jsDelivr CDN cache"
        env:
          REPO_SLUG: ${{ github.repository }}
        run: python collections/scripts/purge.py || true
