# ─────────────────────────────────────────────────────────────────────────────
# .github/workflows/generate-glass-covers.yml
#
# tiny-deluxe · Nuvio TV — Glassmorphism Cover Generator
#
# Generates landscape-only cover cards with a glassmorphism bottom panel.
# Two files are written per catalog (no portrait, no backdrop):
#
#   main/test/{folder}/focused/{catalog}_landscape.jpg(.webp)  — dimmed + glass
#   main/test/{folder}/cover/{catalog}_landscape.jpg(.webp)    — full-bright + glass
#
# A frosted-glass blur panel covers the bottom 22% of the image (subtle blur,
# dark scrim gradient, micro-grit noise, 1px specular edge). The catalog title
# is rendered bold, lower-left aligned, one word per line (font size 130pt, fixed).
# "focused" cards blend the backdrop with 28% black before the glass panel.
#
# Secrets  (Settings → Secrets and variables → Actions)
# ─────────────────────────────────────────────────────────────────────────────
#   AIOMETADATA_URL   Base URL of your AIOMetadata Stremio addon (recommended)
#   TMDB_API_KEY      TMDb API key (optional fallback)
# ─────────────────────────────────────────────────────────────────────────────

name: "✨ Nuvio · Glass Cover Generator"

on:
  workflow_dispatch:
    inputs:

      target:
        description: >
          Folder (e.g. streaming), catalog slug (e.g. netflix), or "all".
        required: true
        default: "all"
        type: string

      force_regenerate:
        description: >
          Force regeneration even when glass cover files already exist on disk.
        required: false
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  generate-glass-covers:
    name: "Generate & Commit Glass Cover Assets"
    runs-on: ubuntu-latest

    steps:

      # ── 1. Checkout ───────────────────────────────────────────────────────────────────
      - name: "📥 Checkout repository"
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ── 2. Python ────────────────────────────────────────────────────────────────────
      - name: "🐍 Set up Python 3.11"
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      # ── 3. Fonts — required for title rendering ───────────────────────────────────────
      - name: "🖋️ Install fonts (Open Sans Bold, NimbusSans, LiberationSans)"
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            fonts-open-sans \
            fonts-urw-base35 \
            fonts-liberation
          fc-cache -fv
          fc-list | grep -i "open.sans\|nimbus\|liberation" | head -10 || true

      # ── 4. Python dependencies ──────────────────────────────────────────────────────────
      - name: "📦 Install Python dependencies"
        run: |
          python -m pip install --upgrade pip
          pip install requests Pillow numpy
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      # ── 5. Validate nuvio-collections.json ───────────────────────────────────────────
      - name: "🔍 Validate nuvio-collections.json"
        run: |
          if [ ! -f nuvio-collections.json ]; then
            echo "❌  nuvio-collections.json not found in the repository root."
            exit 1
          fi
          python3 -c "
          import json, sys
          with open('nuvio-collections.json') as f:
              data = json.load(f)
          items = data if isinstance(data, list) else data.get('catalogs', [])
          flat = []
          for item in items:
              flat.extend(item['folders']) if 'folders' in item else flat.append(item)
          matches = [c['id'] for c in flat
                     if c.get('id','').startswith('collections.')
                     and c['id'].count('.') == 2]
          print(f'Found {len(matches)} collections.* catalog(s):')
          for m in matches[:10]:
              print(f'  {m}')
          if len(matches) > 10:
              print(f'  ... and {len(matches) - 10} more')
          if not matches:
              print('Warning: No collections.{folder}.{catalog} IDs found.')
              sys.exit(1)
          "

      # ── 6. Generate glass cover assets ─────────────────────────────────────────────
      - name: "✨ Generate glassmorphism cover assets"
        env:
          AIOMETADATA_URL: ${{ secrets.AIOMETADATA_URL }}
          TMDB_API_KEY:    ${{ secrets.TMDB_API_KEY }}
        run: |
          FORCE_FLAG=""
          if [ "${{ github.event.inputs.force_regenerate }}" = "true" ]; then
            FORCE_FLAG="--force"
          fi
          python generate_glass_covers.py \
            --target "${{ github.event.inputs.target }}" \
            --json   nuvio-collections.json \
            $FORCE_FLAG

      # ── 7. Commit & push ───────────────────────────────────────────────────────────────────
      - name: "📤 Commit & push glass cover assets"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add \
            "main/test/*/focused/*.jpg"  \
            "main/test/*/focused/*.webp" \
            "main/test/*/cover/*.jpg"    \
            "main/test/*/cover/*.webp"   \
            2>/dev/null || true

          if git diff --cached --quiet; then
            echo "✅  No new glass covers — nothing to commit."
          else
            N_FOC=$(git diff --cached --name-only | grep -c '/focused/' || true)
            N_COV=$(git diff --cached --name-only | grep -c '/cover/'   || true)
            TARGET="${{ github.event.inputs.target }}"
            git commit -m "✨ Glass covers: target=${TARGET} — ${N_FOC} focused, ${N_COV} cover(s) [Automated]"
            REMOTE="https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}.git"
            for attempt in 1 2 3 4 5; do
              git pull --rebase "$REMOTE" ${{ github.ref_name }} 2>/dev/null \
                || { git rebase --abort 2>/dev/null || true; }
              if git push "$REMOTE" HEAD:${{ github.ref_name }}; then
                echo ""
                echo "✅  Pushed to ${{ github.ref_name }} (attempt ${attempt})."
                echo "    ↓ ${N_FOC}  focused landscape(s)"
                echo "    ↓ ${N_COV}  cover landscape(s)"
                break
              fi
              if [ "${attempt}" -eq 5 ]; then
                echo "❌  Push failed after 5 attempts."
                exit 1
              fi
              echo "⚠  Attempt ${attempt} failed — retrying in $((attempt * 2))s..."
              sleep $((attempt * 2))
            done
          fi
