# ──────────────────────────────────────────────────────────────────────────────
# .github/workflows/nuvio_render.yml
#
# Kaleido · Nuvio Backdrop CDN  —  GitHub Actions Workflow  (corrected build)
#
# Bugs fixed vs. previous build
# ──────────────────────────────────────────────────────────────────────────────
#  Bug 2  Missing `permissions: contents: write` block  →  added below.
#         Without it GitHub Actions defaults to read-only and git push fails.
#
#  Bug 7a Missing `fetch-depth: 0` on checkout  →  added.
#         Shallow clones can cause "non-fast-forward" push rejections.
#
#  Bug 7b Bare `git push` with no token  →  replaced with the standard
#         `git push https://x-access-token:${GITHUB_TOKEN}@github.com/…`
#         pattern so the push always authenticates correctly regardless
#         of the runner's default credential state.
#
#  Bonus  Removed the prism-wallpapers clone step entirely.  The renderer
#         is now self-contained inside nuvio_pipeline.py (Pillow only), so
#         no external repo clone is needed — the step was also the source
#         of the `cp -r engine/* .` path confusion in the original build.
# ──────────────────────────────────────────────────────────────────────────────

name: "🎬 Nuvio Backdrop CDN Render"

on:
  # ── Manual trigger: Actions tab → "Run workflow" button ─────────────────────
  workflow_dispatch:
    inputs:
      reason:
        description: "Optional note (e.g. 'Added new catalogs')"
        required: false
        default: "Manual refresh"

  # ── Auto-trigger whenever you upload a new AIOMetadata.json export ──────────
  push:
    paths:
      - "AIOMetadata.json"

  # ── Scheduled automatic run (remove the leading # from both lines below) ────
  # schedule:
  #   - cron: "0 3 * * *"   # Every day at 03:00 UTC  →  https://crontab.guru

# ──────────────────────────────────────────────────────────────────────────────
# BUG 2 FIX: grant write access so the bot can commit images back to the repo.
# ──────────────────────────────────────────────────────────────────────────────
permissions:
  contents: write

jobs:
  render-backdrops:
    name: "Render & Push Backdrops"
    runs-on: ubuntu-latest

    steps:

      # ── 1. Checkout ──────────────────────────────────────────────────────────
      # BUG 7a FIX: fetch-depth: 0 retrieves full history so the subsequent
      # git push never hits a "non-fast-forward" rejection.
      - name: "📥 Checkout repository"
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ── 2. Python ────────────────────────────────────────────────────────────
      - name: "🐍 Set up Python 3.11"
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      # ── 3. Dependencies ───────────────────────────────────────────────────────
      # NOTE: prism-wallpapers is no longer cloned.  The backdrop renderer is
      # now self-contained inside nuvio_pipeline.py using Pillow only, which
      # eliminates the fragile subprocess / wrong-CLI-contract failure mode.
      - name: "📦 Install Python dependencies"
        run: |
          python -m pip install --upgrade pip
          pip install requests Pillow
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          fi

      # ── 4. Run pipeline ───────────────────────────────────────────────────────
      - name: "🚀 Run Nuvio backdrop pipeline"
        env:
          # Secrets are injected here from Settings → Secrets and variables → Actions
          TMDB_API_KEY:   ${{ secrets.TMDB_API_KEY }}
          FANART_API_KEY: ${{ secrets.FANART_API_KEY }}
          # NOTE: AIOMETADATA_URL is not used by this pipeline because it reads
          # AIOMetadata.json directly from the repository.  To pick up new or
          # changed catalogs, re-export from your AIOMetadata app and upload the
          # new AIOMetadata.json file to the repository root.
        run: |
          python nuvio_pipeline.py

      # ── 5. Commit & push new backdrops ────────────────────────────────────────
      # BUG 7b FIX: explicit token in the push URL guarantees authentication
      # regardless of the runner's default git credential state.
      - name: "📤 Commit & push new backdrops to CDN"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Stage only the collections/ output folder
          git add collections/

          # Check if anything actually changed before committing
          if git diff --cached --quiet; then
            echo "✅  No new backdrops were generated — nothing to commit."
          else
            CHANGED=$(git diff --cached --name-only | wc -l)
            git commit -m "🎬 Refresh Nuvio Backdrops — Automated Run [${CHANGED} file(s) updated]"

            # Authenticated push using the built-in GITHUB_TOKEN
            git push "https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}.git" HEAD:main

            echo "✅  Pushed ${CHANGED} updated asset(s) to repository CDN."
          fi
