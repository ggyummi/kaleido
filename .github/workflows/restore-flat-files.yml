name: Restore t1_flat and t2_flat files

on:
  workflow_dispatch:

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Restore t1_flat and t2_flat files from previous commit
        run: |
          git diff --name-only --diff-filter=D HEAD~1 HEAD \
            | grep -E '_(t1|t2)_flat\.(jpg|webp)$' \
            | while read f; do
                git checkout HEAD~1 -- "$f"
              done
          echo "Restored files:"
          git diff --cached --name-only

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "restore: bring back t1_flat and t2_flat files"
          git push
